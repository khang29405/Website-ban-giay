<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - MyShoes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e01e26'/><text x='50' y='70' font-family='Arial, sans-serif' font-weight='800' font-size='58' fill='white' text-anchor='middle'>M</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/cart.css">
</head>
<body>
    <header id="header"></header>

    <main>
        <div class="container">
            <h1 class="section-title">Giỏ hàng của bạn</h1>

            <div id="cart-guest" class="empty-state" hidden>
                <strong>Bạn cần đăng nhập để xem giỏ hàng</strong>
                <p><a href="login.html" class="btn btn-accent">Đăng nhập</a></p>
            </div>

            <div id="cart-content" class="fade-in" hidden>
                <div class="cart-layout">
                    <div class="cart-items" id="cart-items">
                        <div class="empty-state"><strong>Đang tải giỏ hàng...</strong></div>
                    </div>
                    <aside class="cart-summary">
                        <h3>Tổng cộng</h3>
                        <div class="cart-summary-row">
                            <span>Tạm tính</span>
                            <strong id="cart-total">0₫</strong>
                        </div>
                        <button type="button" class="btn btn-accent btn-block" id="checkout-btn">Tiến hành đặt hàng</button>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/validate.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/cart.js"></script>
</body>
</html>
