<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script src="../js/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShoes - Giày chính hãng</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e01e26'/><text x='50' y='70' font-family='Arial, sans-serif' font-weight='800' font-size='58' fill='white' text-anchor='middle'>M</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dark-theme.css">
</head>
<body>
    <header id="header"></header>

    <main>
        <section class="hero">
            <div class="hero-bg"></div>
            <div class="hero-overlay"></div>
            <div class="container">
                <div class="hero-inner">
                    <span class="eyebrow">Bộ sưu tập mới</span>
                    <h1>Đúng đôi giày, đúng phong cách của bạn</h1>
                    <p>Hàng trăm mẫu giày chính hãng từ Nike, Adidas, Puma, Converse, Vans — cho mọi hoạt động, từ sân bóng đến phố đi bộ.</p>
                    <div class="hero-actions">
                        <a href="san-pham.html" class="btn btn-accent"><i class="fa-solid fa-magnifying-glass"></i> Khám phá sản phẩm</a>
                        <a href="about.html" class="btn btn-hero-outline"><i class="fa-solid fa-circle-info"></i> Về MyShoes</a>
                    </div>
                </div>
            </div>
        </section>

        <div class="container" id="featured">
            <h2 class="section-title">Sản phẩm nổi bật</h2>
            <p class="section-subtitle">Những mẫu giày mới nhất tại MyShoes.</p>

            <div class="product-grid" id="product-grid">
                <div class="empty-state"><strong>Đang tải sản phẩm...</strong></div>
            </div>

            <div class="featured-more">
                <a href="san-pham.html" class="btn btn-outline"><i class="fa-solid fa-list"></i> Xem tất cả sản phẩm</a>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/validate.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/index.js"></script>
</body>
</html>
