<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyShoes - Giày thể thao chính hãng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
</head>
<body>
    <header id="header"></header>

    <main>
        <section class="hero">
            <div class="container">
                <div class="hero-inner">
                    <span class="eyebrow">Bộ sưu tập mới</span>
                    <h1>Bước đi đẳng cấp</h1>
                    <p>Giày thể thao chính hãng từ Nike, Adidas, Puma, Converse, Vans — chọn đúng đôi, chạy đúng chất.</p>
                    <a href="#catalog" class="btn btn-accent">Khám phá ngay</a>
                </div>
            </div>
        </section>

        <div class="container" id="catalog">
            <h2 class="section-title">Sản phẩm nổi bật</h2>
            <p class="section-subtitle">Duyệt toàn bộ bộ sưu tập, tìm kiếm và lọc theo đúng nhu cầu của bạn.</p>

            <div class="catalog-toolbar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Tìm theo tên sản phẩm...">
                </div>
                <select id="category-filter" class="filter-select">
                    <option value="">Tất cả danh mục</option>
                </select>
                <select id="brand-filter" class="filter-select">
                    <option value="">Tất cả thương hiệu</option>
                </select>
            </div>

            <div class="product-grid" id="product-grid">
                <div class="empty-state"><strong>Đang tải sản phẩm...</strong></div>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/index.js"></script>
</body>
</html>
