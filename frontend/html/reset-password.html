<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script src="../js/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - MyShoes</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23e01e26'/><text x='50' y='70' font-family='Arial, sans-serif' font-weight='800' font-size='58' fill='white' text-anchor='middle'>M</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/dark-theme.css">
</head>
<body>
    <header id="header"></header>

    <main>
        <div class="container">
            <div class="auth-wrapper">
                <div class="auth-card fade-in">
                    <h2>Đặt lại mật khẩu</h2>
                    <p class="auth-subtitle" id="auth-subtitle">Nhập mật khẩu mới cho tài khoản của bạn.</p>

                    <div id="form-success" class="form-success" hidden></div>
                    <div id="form-error" class="form-error" hidden></div>

                    <form id="reset-password-form" novalidate>
                        <div class="form-group">
                            <div class="form-label-row">
                                <label for="password">Mật khẩu mới</label>
                                <div class="password-hint-wrap">
                                    <button type="button" class="password-hint-btn" aria-label="Yêu cầu mật khẩu">
                                        <i class="fa-solid fa-circle-info"></i>
                                    </button>
                                    <div class="password-hint-tooltip" id="password-hint-tooltip"></div>
                                </div>
                            </div>
                            <div class="password-input-wrap">
                                <input type="password" id="password" name="MatKhauMoi" required minlength="8">
                                <button type="button" class="password-toggle-btn" id="password-toggle-btn" aria-label="Hiện mật khẩu">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <div class="password-live-hint" id="password-live-hint" hidden></div>
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Xác nhận mật khẩu mới</label>
                            <div class="password-input-wrap">
                                <input type="password" id="confirm-password" name="XacNhanMatKhau" required minlength="8">
                                <button type="button" class="password-toggle-btn" id="confirm-password-toggle-btn" aria-label="Hiện mật khẩu">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-accent btn-block"><i class="fa-solid fa-key"></i> Đặt lại mật khẩu</button>
                    </form>

                    <p class="auth-switch" id="auth-switch">Đã nhớ mật khẩu? <a href="login.html">Đăng nhập</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/validate.js"></script>
    <script src="../js/layout.js"></script>
    <script src="../js/pages/reset-password.js"></script>
</body>
</html>
